# The page is checked two ways: the structure job and the syntax job aim at
# mistakes that fail *silently* in production - a script missing from the
# ordered list in index.html, a host missing from the Content Security Policy,
# a syntax error in a file nothing parses until a browser, or health.yml's
# schedule, does - and the e2e job (Playwright Test) opens it in a real Chrome
# and fails on whatever the browser objects to. The rules job runs the unit
# tests (tests/unit/), among them
# the Worker behind /api, the page's own functions in a node:vm, and the Apps
# Script setup() of the teams notice against a fake spreadsheet. Seven jobs, the
# e2e one on two machines (a half of the suite each); four are required
# (structure, syntax, rules, page), and page passes only if e2e and coverage did.
# The seventh, warn, is not required and page does not wait for it: it runs what
# depends on the machine's speed (@timing), is quarantined (@quarantine) or only advises (@advisory), and its red is read, never a block.
name: Checks

on:
  pull_request:
  push:
    # main only. Without this, pushing to a pull request branch would run
    # everything twice - once for the push, once for the pull request.
    branches: [main]

# A new push to a pull request cancels that pull request's older run; a push to
# main never cancels or is cancelled. A group keeps one pending run and a third
# arrival replaces it even without cancel-in-progress, so outside a pull request
# the group is the run id: unique, nothing to replace. In a pull request
# github.ref is refs/pull/N/merge, stable per PR. The workflow name stays in the
# group because groups are global to the repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read the checked-out tree. Nothing here needs a token that
# can write, so nothing here gets one.
permissions:
  contents: read

jobs:
  # Every job has a timeout: GitHub's default is 360 minutes, so a hung Chrome
  # or test would otherwise hold a runner for six hours.
  # Separate jobs rather than one script, so the name in the annotation and in the
  # failure email already says which kind of thing broke.
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own Node: the script imports nothing outside the standard library.
      - name: Scripts, styles, hosts, the ?demo= banner code, the notice and the sitemap
        run: node scripts/check-structure.mjs

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A syntax error in any of these files takes the whole page down, and
      # says so nowhere except the browser console of whoever opened it.
      # node --check parses a file without running a line of it. The Worker
      # behind /api too, and the checks under scripts/: .mjs, so they parse as modules on any Node version.
      # The Apps Scripts are .gs, which node does not know: each is checked
      # as a temporary .js copy.
      - name: Parse every script
        run: |
          set -euo pipefail
          for f in site/js/*.js worker/*.mjs scripts/*.mjs; do
            node --check "$f"
          done
          for f in apps-script/*/*.gs; do
            cp "$f" "$RUNNER_TEMP/$(basename "$f" .gs).js"
            node --check "$RUNNER_TEMP/$(basename "$f" .gs).js"
          done
          echo "$(ls site/js/*.js worker/*.mjs scripts/*.mjs apps-script/*/*.gs | wc -l) scripts parse."

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own Node, no setup step and nothing installed: node:test
      # is built in, and node:sqlite (the fake D1) needs 22.13 or later, which
      # the image carries (Node 22; the step prints the exact version).
      # The page's own rules (tests/unit/page/: the scripts in a
      # node:vm, no browser) and the notice's Apps Script setup() ride along.
      # The dot reporter keeps the log to the failures.
      - name: The unit tests (tests/unit/**/*.test.mjs)
        run: |
          node --version
          node --test --test-reporter=dot "tests/unit/**/*.test.mjs"

  # Playwright Test (tests/e2e): the repository's dependencies (with monocart-coverage-reports
  # and @axe-core/playwright, below), for the tests only - the exact versions of the lockfile, no install scripts, no
  # browser downloaded (the image's Google Chrome), no secret, the same
  # read-only token. The API and the sheets answer from a recording, so a GW2
  # outage cannot turn a pull request red; the tests run the pull request's
  # JavaScript in a browser: throwaway machine, no secret.
  # Two machines, one half of the suite each (--shard); a red half does not cancel the other.
  # Not run here: the tests tagged @timing (they count frames, which a busy shared machine
  # moves), those tagged @quarantine and those tagged @advisory; the warn job runs them.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the test dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Chrome version
        run: |
          echo "Chrome: $(google-chrome --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      # The runner's commands are stopped while the tests run: a failure prints
      # what the page said, and a line of it starting with "::" would be read as
      # one. support/summary.mjs turns them back on (E2E_RESUME) only to write
      # its own warnings for tests that passed on their retry.
      - name: The page in Playwright Test (a retry passing is a warning, a skip fails)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          set +e
          E2E_COVERAGE=1 E2E_RESUME="$token" npx playwright test --shard="$SHARD/2" --grep-invert '@timing|@quarantine|@advisory'
          code=$?
          echo "::$token::"
          exit "$code"

      # The raw V8 coverage of this half, for the coverage job to join. Hidden files are
      # opted in: the folder starts with a dot, and upload-artifact skips those by default.
      - name: Keep this shard's coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: tests/e2e/test-results/coverage/.cache/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Traces of what failed, kept three days; nothing on a green run.
      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: tests/e2e/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # What may fail without blocking: the tests tagged @timing, @quarantine and @advisory (the rule:
  # CONTRIBUTING.md). Not in page's needs and not in the ruleset, so red here blocks
  # nothing; the summary lists what failed. No coverage: the coverage job joins the e2e
  # halves only.
  warn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the test dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Chrome version
        run: |
          echo "Chrome: $(google-chrome --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Same stop-commands guard as the e2e job. What failed goes to the summary.
      - name: The timing, quarantined and advisory tests in Playwright Test
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          set +e
          E2E_RESUME="$token" npx playwright test --grep '@timing|@quarantine|@advisory' 2>&1 | tee warn-output.txt
          code=${PIPESTATUS[0]}
          echo "::$token::"
          {
            echo "### axe: contrast, names, aria, ids (the page, a search, a map, a 320 px phone)"
            cat test-results/axe-*.md 2>/dev/null
            echo "### warn: timing, quarantine and advisory"
            if grep -qE '^e2e (FAIL|FLAKY|SKIPPED) ' warn-output.txt; then
              echo '```'
              grep -E '^e2e (FAIL|FLAKY|SKIPPED) ' warn-output.txt
              echo '```'
            else
              grep -E '^e2e: ' warn-output.txt || echo "no result line"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warn-traces
          path: tests/e2e/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # Coverage (support/coverage.mjs says how): the two halves' raw coverage joined with the
  # node tests run again with V8 coverage on (so the `rules` job and `page` keep their
  # names and rule) into the table per file; a file whose node --test coverage falls more
  # than 0.5 point fails this job, so `page`. The browser's share is reported, never a floor.
  coverage:
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's HEAD is the merge commit; depth 2 brings its first parent, the base

      - name: Install the test dependencies from the lockfile
        run: npm ci --ignore-scripts

      # Without merge-multiple each half lands in its own folder, shards/coverage-shard-<n>/.
      - name: Download both halves' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: tests/e2e/shards

      # Exactly two folders: a missing half fails here by name, not later as a coverage drop.
      - name: Join the halves
        run: |
          count=$(ls -d shards/coverage-shard-* | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "expected 2 coverage shards, found $count" >&2
            exit 1
          fi
          mkdir -p test-results/coverage/.cache
          # One copy per folder: the source-<hash>.json files share names across halves (same content), and one cp refuses them.
          for d in shards/coverage-shard-*/; do cp "$d"* test-results/coverage/.cache/; done

      - name: Coverage per file, and node's may not fall
        run: |
          node support/coverage.mjs node
          node support/coverage.mjs check

      # What the pull request added in site/js, worker and supabase that no test ran, in the
      # summary. It lists and never fails: whether a new line asks for a test is judgement.
      # HEAD^1 is the base the merge commit was made on, so the diff is the pull request's (a line changed
      # inside a multi-line statement counts only where the statement starts). continue-on-error: it never fails the job.
      - name: New code no test runs (summary only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: node support/coverage.mjs untested "$(git rev-parse HEAD^1)"

  # The required check. The ruleset names `page`, so this job keeps the name
  # and passes only when `e2e` and `coverage` did: a job that was skipped counts as a success
  # to the ruleset, hence always() and the explicit test.
  page:
    needs: [e2e, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A result is success, failure, cancelled or skipped; only success passes.
      - name: Playwright Test passed
        env:
          E2E: ${{ needs.e2e.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          failed=0
          for pair in "e2e=$E2E" "coverage=$COVERAGE"; do
            echo "$pair"
            case "${pair#*=}" in
              success) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
