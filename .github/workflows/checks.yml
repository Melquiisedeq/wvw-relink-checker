# The page has no unit tests: there is no pure function to call, just a page and
# the scripts that build it. What it has is a set of mistakes that fail
# *silently* in production - a script missing from the ordered list in
# index.html, a host missing from the Content Security Policy, a syntax error in
# a file nothing parses until a browser does. The first two jobs are aimed at
# exactly those, and the last one opens the page in a real Chrome and fails on
# whatever the browser objects to. The Worker behind /api is different: it is
# rules - what it refuses, keeps and serves - and the third job runs them.
name: Checks

on:
  pull_request:
  push:
    # main only. Without this, pushing to a pull request branch would run
    # everything twice - once for the push, once for the pull request.
    branches: [main]

# The jobs only read the checked-out tree. Nothing here needs a token that
# can write, so nothing here gets one.
permissions:
  contents: read

jobs:
  # Every job has a timeout: GitHub's default is 360 minutes, so a hung Chrome
  # or test would otherwise hold a runner for six hours.
  # Separate jobs rather than one script, so the name in the annotation and in the
  # failure email already says which kind of thing broke.
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # python3, not python: Ubuntu does not guarantee the shorter name exists.
      - name: Scripts, styles, hosts, the hatch, the notice and the sitemap
        run: python3 .github/scripts/check-structure.py

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A syntax error in any of these files takes the whole page down, and
      # says so nowhere except the browser console of whoever opened it.
      # node --check parses a file without running a line of it. The Worker
      # behind /api too: .mjs, so it parses as a module on any Node version.
      # The Apps Scripts are .gs, which node does not know: each is checked
      # as a temporary .js copy.
      - name: Parse every script
        run: |
          set -euo pipefail
          for f in site/js/*.js worker/*.mjs; do
            node --check "$f"
          done
          for f in apps-script/*/*.gs; do
            cp "$f" "$RUNNER_TEMP/$(basename "$f" .gs).js"
            node --check "$RUNNER_TEMP/$(basename "$f" .gs).js"
          done
          echo "$(ls site/js/*.js worker/*.mjs apps-script/*/*.gs | wc -l) scripts parse."

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own Node, no setup step and nothing installed: node:test
      # is built in, and node:sqlite (the fake D1) needs 22.13 or later, which
      # the image carries (22.23.2 on ubuntu-24.04, read 30/09/2026).
      # The page's own rules ride along (tests/page-rules.test.mjs: the scripts
      # in a node:vm, no browser). The dot reporter keeps the log to the failures.
      - name: What the /api Worker refuses, keeps and serves, and the page's rules
        run: node --test --test-reporter=dot "tests/*.test.mjs"

  # Playwright Test (.github/e2e): the repository's one dependency, for the
  # tests only - the exact versions of the lockfile, no install scripts, no
  # browser downloaded (the image's Google Chrome), no secret, the same
  # read-only token. The API and the sheets answer from a recording, so a GW2
  # outage cannot turn a pull request red; the tests run the pull request's
  # JavaScript in a browser: throwaway machine, no secret.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Playwright Test from the lockfile
        run: npm ci --ignore-scripts

      - name: Chrome version
        run: |
          echo "Chrome: $(google-chrome --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      # The runner's commands are stopped while the tests run: a failure prints
      # what the page said, and a line of it starting with "::" would be read as
      # one. support/summary.mjs turns them back on (E2E_RESUME) only to write
      # its own warnings for tests that passed on their retry.
      - name: The page in Playwright Test (a retry passing is a warning, a skip fails)
        run: |
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          set +e
          E2E_RESUME="$token" npx playwright test
          code=$?
          echo "::$token::"
          exit "$code"

      # Traces of what failed, kept three days; nothing on a green run.
      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: .github/e2e/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # The required check. The ruleset names `page`, so this job keeps the name
  # and passes only when `e2e` did: a job that was skipped counts as a success
  # to the ruleset, hence always() and the explicit test.
  page:
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A result is success, failure, cancelled or skipped; only success passes.
      - name: Playwright Test passed
        env:
          E2E: ${{ needs.e2e.result }}
        run: |
          failed=0
          for pair in "e2e=$E2E"; do
            echo "$pair"
            case "${pair#*=}" in
              success) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
